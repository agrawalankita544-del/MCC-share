<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Version 1 · Commission link below share · MCC share from PDP</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9F2089}a:hover{color:#9F2089}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid #5585F8;outline-offset:2px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes drift{from{opacity:0;transform:translateY(-24px) rotate(0deg)}to{opacity:1;transform:translateY(0) rotate(var(--r))}}
@keyframes pop{0%{transform:scale(.6) rotate(-10deg);opacity:0}70%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.fade{animation:fade .25s ease}
.rise{animation:rise .25s ease}
.up{animation:up .34s cubic-bezier(.2,.8,.2,1)}
.pop{animation:pop .6s .25s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.fade,.rise,.up,.pop{animation:none}}
</style>
<style>
html,body{margin:0;background:#EAEAF2}
#stage{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
#fit{transform-origin:top center}
</style>
<script src="assets/preact.umd.js"></script>
<script src="assets/runtime.js"></script>
</head>
<body>
<div id="stage"><div id="fit"><div id="app"></div></div></div>
<template id="tpl">
<div style="width: 820px; height: 840px; box-sizing: border-box; padding: 40px; display: flex; gap: 40px; align-items: flex-start; background: #EAEAF2; font-family: Inter, system-ui, sans-serif; color: #353543">

<!-- ===== FLOW STEPS ===== -->
<div style="width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border-radius: 16px; padding: 20px; box-sizing: border-box; border: 1px solid #CECEDE">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 12px; font-weight: 600; color: #9F2089">From Figma · Version 1 (219:93409)</div>
    <div style="font-size: 18px; font-weight: 700; line-height: 1.3">Version 1 · commission link below the share options</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
      <button onClick="{{st.go}}" aria-current="{{st.current}}" style="{{st.style}}">
        <span style="{{st.badge}}">{{st.num}}</span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; font-weight: 700">{{st.title}}</span>
          <span style="font-size: 12px; line-height: 1.4; color: #616173">{{st.sub}}</span>
        </span>
      </button>
    </sc-for>
  </div>
  <button onClick="{{reset}}" style="height: 40px; border-radius: 10px; border: 1px solid #CECEDE; background: #FFFFFF; color: #353543; font-size: 13px; font-weight: 600">Start over</button>
  <div style="font-size: 12px; line-height: 1.5; color: #616173; background: #F8F8FF; border-radius: 10px; padding: 10px 12px"><strong style="color: #353543">Stand-ins:</strong> the Congratulations illustration, confetti and product photo are drawn here instead of exported, and Mier B02 shows as Mulish. Everything else matches the frames.</div>
</div>

<!-- ===== DEVICE 360 × 720 ===== -->
<div style="flex-shrink: 0; padding: 10px; background: #1C1820; border-radius: 34px">
<div style="position: relative; width: 360px; height: 720px; overflow: hidden; background: #FFFFFF; border-radius: 24px; font-family: Mulish, system-ui, sans-serif; color: #353543">

  <!-- ===== 1 · PRODUCT PAGE ===== -->
  <div style="position: absolute; inset: 0; background: #FFFFFF">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 26px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">
      <span>{{clock}}</span>
      <span style="display: flex; gap: 5px; align-items: center"><span style="width: 16px; height: 10px; border-radius: 2px; background: #353543; opacity: .85"></span><span style="width: 22px; height: 11px; border-radius: 3px; border: 1.5px solid #353543; box-sizing: border-box"></span></span>
    </div>
    <div style="height: 40px; display: flex; align-items: center; padding: 0 12px; gap: 14px">
      <button onClick="{{other}}" aria-label="Back" style="width: 32px; height: 32px; border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#353543" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <span style="flex: 1"></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#353543" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#353543" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#353543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"></path><circle cx="9" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>
    </div>
    <div style="height: 30px; margin: 0 0 0; padding: 0 12px; display: flex; align-items: center; background: linear-gradient(90deg, #FDE2FA 0%, #FFFFFF 100%)">
      <span style="display: inline-flex; align-items: center; gap: 4px; background: #C90179; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 2px 8px 2px 6px; border-radius: 3px 0 0 3px">
        <img src="assets/flame-badge.svg" alt="" width="14" height="14" style="display: block">Affiliate</span>
      <span style="font-size: 12px; color: #353543; padding-left: 8px">9.6% Commission</span>
    </div>
    <div style="position: relative; height: 270px; display: flex; align-items: center; justify-content: center; background: #FFFFFF">
      <img src="assets/product-thumb.png" alt="Dream Stardust eyeshadow and highlighter palette" style="width: 210px; height: 233px; object-fit: contain">
      <span style="position: absolute; left: 12px; bottom: 8px; font-size: 10px; color: #8B8BA3">s-634395772</span>
      <span style="position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: #353543; background: #FFFFFF; border: 1px solid #EAEAF2; border-radius: 12px; padding: 3px 8px">More Like This</span>
    </div>
    <div style="padding: 10px 12px 0; display: flex; gap: 10px">
      <span style="flex: 1; font-size: 13px; line-height: 17px; color: #616173">Dream Stardust Eyeshadow &amp; Highlighter Palette – Shade 01 &amp; 02</span>
      <button onClick="{{other}}" style="border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #353543; width: 44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#353543" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Wishlist</button>
      <button onClick="{{openShare}}" style="border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #353543; width: 44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#353543" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.9l7.6-4.4M8.2 13.1l7.6 4.4"></path></svg>Share</button>
    </div>
    <div style="padding: 6px 12px 0; display: flex; align-items: baseline; gap: 6px"><span style="font-size: 22px; font-weight: 800">₹232</span><span style="font-size: 12px; color: #8B8BA3; text-decoration: line-through">259</span><span style="font-size: 12px; color: #038D63; font-weight: 700">10% off</span></div>
    <div style="margin: 8px 12px 0; display: inline-flex; align-items: center; gap: 6px; background: #F8F8FF; border-radius: 4px; padding: 4px 8px; font-size: 12px; color: #353543"><strong>UPI Offer</strong> applied for you!</div>
    <div style="padding: 8px 12px 0; font-size: 12px; color: #616173">₹259 with COD</div>
    <div style="padding: 8px 12px 0; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #616173"><span style="background: #038D63; color: #FFFFFF; font-weight: 700; padding: 1px 6px; border-radius: 8px">5 ★</span>(4) Ratings</div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 18px; background: #FFFFFF; border-top: 1px solid #EAEAF2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button onClick="{{other}}" style="height: 40px; border-radius: 4px; border: 1px solid #9F2089; background: #FFFFFF; color: #9F2089; font-size: 13px; font-weight: 700">Add to Cart</button>
      <button onClick="{{other}}" style="height: 40px; border-radius: 4px; border: none; background: #9F2089; color: #FFFFFF; font-size: 13px; font-weight: 700">Buy Now</button>
    </div>
  </div>

  <!-- scrim (80% Grey/Base, as in the frames) -->
  <sc-if value="{{showScrim}}" hint-placeholder-val="{{ true }}">
    <div class="fade" style="position: absolute; inset: 0; background: rgba(53,53,67,0.8)">
      <button onClick="{{scrimTap}}" aria-label="Close" style="position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: transparent"></button>
    </div>
  </sc-if>

  <!-- ===== 2–3 · SHARE SHEET ===== -->
  <sc-if value="{{isShare}}" hint-placeholder-val="{{ true }}">
  <div class="up" style="{{sheetStyle}}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 27px; width: 360px; height: 360px; pointer-events: none; z-index: 1; opacity: 0.4">
      <sc-if value="{{isB}}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{confetti}}" as="c" hint-placeholder-count="0"><span style="{{c}}"></span></sc-for>
      </sc-if>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 68px; background: #FFFFFF; z-index: 3">
      <div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; gap: 16px; align-items: flex-start">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 16px">
          <span style="font-weight: 600; color: #353543; letter-spacing: 0.065px; text-transform: uppercase">Share</span>
          <span style="color: #616173; letter-spacing: 0.0195px">Charvi Attractive Sarees</span>
        </div>
        <button onClick="{{closeAll}}" aria-label="Close" style="width: 24px; height: 24px; padding: 0; border: none; background: none"><img src="assets/close.svg" alt="" width="24" height="24" style="display: block"></button>
      </div>
      <div style="position: absolute; left: 0; right: 0; top: 67px; height: 1px; background: #CECEDE"></div>
    </div>
    <div aria-hidden="{{resellerHidden}}" style="{{resellerStyle}}">
      <span style="flex: 1; font-size: 13px; line-height: 16px; font-weight: 600">Are you reselling this product?</span>
      <div style="display: flex; gap: 8px">
        <button onClick="{{noop}}" disabled="{{isB}}" aria-pressed="true" style="padding: 4px 12px; border-radius: 16px; border: 1px solid #D9A6D0; background: #FFE7FB; color: #9F2089; font-size: 13px; line-height: 16px">NO</button>
        <button onClick="{{other}}" disabled="{{isB}}" aria-pressed="false" style="padding: 4px 12px; border-radius: 16px; border: 1px solid #EAEAF2; background: #F8F8FF; color: #666666; font-size: 13px; line-height: 16px">YES</button>
      </div>
    </div>
    <div style="{{divReseller}}"></div>
    <button onClick="{{goBack}}" disabled="{{isA}}" aria-hidden="{{backHidden}}" style="{{backStyle}}"><span aria-hidden="true">←</span> GO BACK</button>

    <div style="{{cardStyle}}">
      <div aria-hidden="true" style="{{cardBgA}}"></div>
      <div aria-hidden="true" style="{{cardBgB}}"></div>
      <button onClick="{{getLink}}" disabled="{{isB}}" aria-hidden="{{cardAHidden}}" style="{{cardA}}">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: 0.015px">Get commission link</span>
          <span style="display: flex; align-items: center; gap: 4px">
            <span style="display: inline-flex; align-items: center; gap: 2px; padding: 1px 4px; border-radius: 4px; background: linear-gradient(90deg, #FEE7F5 0%, rgba(255,255,255,0) 132.55%)">
              <img src="assets/flame-small.svg" alt="" width="12" height="12" style="display: block">
              <span style="font-size: 11px; line-height: 16px; color: #C90179; letter-spacing: 0.132px; white-space: nowrap">9.8% Commission</span>
            </span>
            <span style="font-size: 13px; line-height: 16px; color: #616173; white-space: nowrap">on eligible orders</span>
          </span>
        </span>
        <img src="assets/chevron.svg" alt="" width="24" height="24" style="display: block; flex-shrink: 0">
      </button>
      <div aria-hidden="{{cardBHidden}}" style="{{cardB}}">
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; width: 100%">
          <span style="font-size: 17px; line-height: 20px; font-weight: 700">Commission link created!</span>
          <span style="font-size: 13px; line-height: 16px; color: #616173; letter-spacing: 0.0325px">Share on your socials &amp; earn on eligible orders</span>
        </div>
        <button onClick="{{copyLink}}" disabled="{{isA}}" aria-label="Copy commission link" style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 8px; border: 1px dashed #8B8BA3; background: #FFFFFF; text-align: left">
          <span style="display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 4px; background: #C90179; flex-shrink: 0">
            <img src="assets/flame-badge.svg" alt="" width="14" height="14" style="display: block">
            <span style="font-size: 14px; line-height: 12px; font-weight: 600; color: #FFFFFF">9.8%</span>
          </span>
          <span style="flex: 1; min-width: 0; font-size: 13px; line-height: 16px; color: #616173; text-decoration: underline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{linkText}}</span>
        </button>
      </div>
    </div>

    <div style="{{shareOnStyle}}">
      <div style="position: relative; height: 16px">
        <span style="{{titleA}}">Choose an option to share</span>
        <span style="{{titleB}}">Choose social media to share</span>
      </div>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
        <button onClick="{{it.go}}" aria-label="{{it.aria}}" style="{{it.style}}">
          <img src="{{it.icon}}" alt="" width="32" height="32" style="display: block">
          <span style="{{it.labelStyle}}">{{it.label}}</span>
        </button>
      </sc-for>
    </div>
    <div style="{{divDownloadTop}}"></div>
    <button onClick="{{download}}" style="{{downloadStyle}}">
      <img src="assets/download.svg" alt="" width="24" height="24" style="display: block">
      <span style="font-size: 13px; line-height: 16px">Download Photos</span>
    </button>
    <div style="{{divDownloadBottom}}"></div>
  </div>
  </sc-if>

  <!-- ===== 4 · iOS SHARE SHEET ===== -->
  <sc-if value="{{isOs}}" hint-placeholder-val="{{ false }}">
  <div class="up" style="position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: #F2F2F7; border-radius: 12px 12px 0 0; font-family: Inter, -apple-system, system-ui, sans-serif; color: #000000; z-index: 5">
    <div style="height: 54px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.6); border-radius: 12px 12px 0 0; border-bottom: 1px solid #DCDCE0">
      <span style="width: 34px; height: 34px; border-radius: 8px; background: #6E1C66; color: #FFFFFF; font-family: Mulish, sans-serif; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center">m</span>
      <button onClick="{{osClose}}" aria-label="Close share sheet" style="width: 30px; height: 30px; border-radius: 15px; border: none; background: #E3E3E8; color: #6B6B70; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="display: flex; gap: 14px; padding: 14px 14px 10px; overflow: hidden">
      <sc-for list="{{osApps}}" as="a" hint-placeholder-count="5">
        <button onClick="{{a.go}}" aria-label="{{a.name}}" style="border: none; background: none; padding: 0; width: 60px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #000000">
          <span style="{{a.icon}}">{{a.glyph}}</span>
          <span style="font-size: 11px">{{a.name}}</span>
        </button>
      </sc-for>
    </div>
    <div style="margin: 4px 14px 0; display: flex; flex-direction: column; gap: 10px">
      <button onClick="{{osCopy}}" style="height: 46px; border-radius: 10px; border: none; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: #000000">Copy <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="11" height="13" rx="2"></rect><path d="M15 8V5a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h2"></path></svg></button>
      <div style="border-radius: 10px; background: #FFFFFF; overflow: hidden">
        <sc-for list="{{osRows}}" as="r" hint-placeholder-count="4">
          <button onClick="{{r.go}}" style="width: 100%; height: 44px; border: none; border-bottom: 1px solid #ECECF0; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: #000000; text-align: left">{{r.name}}<span style="font-size: 14px; font-weight: 700; color: #000000">{{r.glyph}}</span></button>
        </sc-for>
      </div>
      <span style="padding: 2px 4px; font-size: 15px; color: #0A7AFF">Edit Actions…</span>
    </div>
  </div>
  </sc-if>

  <!-- ===== 5 · BACK IN MEESHO: CONGRATULATIONS ===== -->
  <sc-if value="{{isUnlocked}}" hint-placeholder-val="{{ false }}">
  <div class="up" style="position: absolute; left: 0; right: 0; bottom: 0; height: 497px; background: #FFFFFF; border-radius: 8px 8px 0 0; overflow: hidden; z-index: 5">
    <div style="height: 52px; position: relative">
      <button onClick="{{closeAll}}" aria-label="Close" style="position: absolute; right: 16px; top: 16px; width: 24px; height: 24px; padding: 0; border: none; background: none; z-index: 3"><img src="assets/close.svg" alt="" width="24" height="24" style="display: block"></button>
    </div>
    <div style="position: relative; height: 445px">
      <div style="position: absolute; left: 50%; margin-left: -162px; top: 13px; width: 325px; height: 338px; box-sizing: border-box; border: 1px solid #E8E8E8; border-radius: 10.556px; overflow: hidden; background: linear-gradient(180deg, #FDE2FA 88.644%, #FFFFFF 100%)">
        <p style="position: absolute; left: 0; right: 0; top: 32px; margin: 0; text-align: center; font-size: 13px; line-height: 20px; letter-spacing: 2.08px; color: #353543">CONGRATULATIONS</p>
        <p style="position: absolute; left: 23px; width: 279px; top: 71px; margin: 0; text-align: center; font-size: 21px; line-height: 24px; font-weight: 700; color: #353543">1st commission link shared <span class="pop" style="display: inline-block">🎉</span></p>
        <p style="position: absolute; left: 36px; width: 253px; top: 105px; margin: 0; text-align: center; font-size: 13px; line-height: 16px; color: #616173; letter-spacing: 0.0325px">Get more commission links and track your earnings in Meesho Creator Club.</p>
        <div aria-hidden="true" style="position: absolute; left: 50%; bottom: -90px; width: 240px; height: 240px; margin-left: -110px; border-radius: 120px; background: #F9CCEE"></div>
        <div aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 120px; height: 110px; margin-left: -40px; border-radius: 60px 60px 0 0; background: #ADC6FF"></div>
        <div aria-hidden="true" style="position: absolute; left: 50%; bottom: 96px; width: 56px; height: 56px; margin-left: -10px; border-radius: 28px; background: #F4C9A8"></div>
        <div aria-hidden="true" style="position: absolute; left: 50%; bottom: 128px; width: 70px; height: 40px; margin-left: -17px; border-radius: 35px 35px 10px 10px; background: #4A2A2A"></div>
        <div aria-hidden="true" style="position: absolute; left: 58px; bottom: 20px; width: 40px; height: 62px; border-radius: 8px; background: #C9A7F0; transform: rotate(-12deg)"></div>
        <span aria-hidden="true" style="position: absolute; left: 150px; top: 168px; color: #E590F9; font-size: 14px">✦</span>
        <span aria-hidden="true" style="position: absolute; left: 196px; top: 186px; color: #F48FB1; font-size: 12px">♥</span>
      </div>
      <button onClick="{{tryNow}}" style="position: absolute; left: 16px; top: 378px; width: 328px; box-sizing: border-box; padding: 12px; border-radius: 4px; border: none; background: #9F2089; color: #FFFFFF; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: 0.0225px">Open Meesho Creator Club</button>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 360px; height: 228px; opacity: 0.4; overflow: hidden; pointer-events: none; z-index: 2">
      <sc-for list="{{confetti}}" as="c" hint-placeholder-count="0"><span style="{{c}}"></span></sc-for>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{isAway}}" hint-placeholder-val="{{ false }}">
    <div class="fade" style="position: absolute; inset: 0; z-index: 8; background: #1C1820; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: Inter, sans-serif">
      <span style="font-size: 15px; font-weight: 600">{{awayTitle}}</span>
      <span style="font-size: 12px; color: #CECEDE">Coming back to Meesho…</span>
    </div>
  </sc-if>

class Component extends DCLogic {

      isShare: v === 'share', isOs: v === 'os', isUnlocked: v === 'unlocked', isAway: !!s.away, awayTitle: s.away,

      noop: function () {},

      isA: !B, isB: B,
      sheetStyle: 'position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 8px 8px 0 0; overflow: hidden; z-index: 4; ' + mv(['height']) + 'height: ' + (B ? 556 : 514) + 'px',
      confetti: FF_CONFETTI,
      resellerHidden: B ? 'true' : 'false',
      resellerStyle: 'position: absolute; left: 16px; right: 16px; top: 79px; height: 26px; display: flex; align-items: center; gap: 4px; z-index: 2; ' + fadeT() + 'opacity: ' + (B ? 0 : 1) + '; transform: translateY(' + (B ? -8 : 0) + 'px); pointer-events: ' + (B ? 'none' : 'auto'),
      divReseller: 'position: absolute; left: 0; right: 0; top: 115px; height: 1px; background: #CECEDE; z-index: 2; ' + fadeT() + 'opacity: ' + (B ? 0 : 1),
      backHidden: B ? 'false' : 'true',
      backStyle: 'position: absolute; left: 16px; top: 80px; z-index: 3; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 16px; border: 1px solid #EAEAF2; background: #FFFFFF; color: #616173; font-size: 13px; line-height: 16px; ' + fadeT(B ? '.3s' : '0s') + 'opacity: ' + (B ? 1 : 0) + '; transform: translateY(' + (B ? 0 : 6) + 'px); pointer-events: ' + (B ? 'auto' : 'none'),
      cardStyle: 'position: absolute; left: 16px; width: 328px; z-index: 2; overflow: hidden; ' + mv(['top', 'height', 'border-radius']) + 'top: ' + (B ? 116 : 422) + 'px; height: ' + (B ? 150 : 68) + 'px; border-radius: ' + (B ? 12 : 8) + 'px',
      cardBgA: 'position: absolute; inset: 0; border: 1px solid #F8F8FF; border-radius: inherit; background: linear-gradient(102.03deg, #FEECF7 0.35%, #FFFFFF 100%); transition: opacity .35s ease; opacity: ' + (B ? 0 : 1),
      cardBgB: 'position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, #FEEDF7 0%, #FFFFFF 100%); transition: opacity .35s ease; opacity: ' + (B ? 1 : 0),
      cardAHidden: B ? 'true' : 'false', cardBHidden: B ? 'false' : 'true',
      cardA: 'position: absolute; left: 0; top: 0; width: 328px; height: 68px; box-sizing: border-box; border: none; background: none; padding: 12px; display: flex; align-items: center; text-align: left; color: #353543; transition: opacity .18s ease; opacity: ' + (B ? 0 : 1) + '; pointer-events: ' + (B ? 'none' : 'auto'),
      cardB: 'position: absolute; left: 0; top: 0; width: 328px; height: 150px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity .3s ease ' + (B ? '.3s' : '0s') + '; opacity: ' + (B ? 1 : 0) + '; pointer-events: ' + (B ? 'auto' : 'none'),
      linkText: s.copied ? 'Link copied' : 'www.meedwedwede/proawdwdut..',

      shareOnStyle: 'position: absolute; left: 0; right: 0; height: 234px; z-index: 2; ' + mv(['top']) + 'top: ' + (B ? 266 : 116) + 'px',

      divDownloadTop: 'position: absolute; left: 0; right: 0; height: 1px; background: #CECEDE; z-index: 2; ' + mv(['top']) + 'top: ' + (B ? 500 : 350) + 'px',
